[package]
name = "vault-api"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
vault-core = { version = "0.1.0", path = "../vault-core" }
zeroize = "1.9.0"

[profile.dev]
lto = true
